name: Build and test iOS
on:
  workflow_dispatch:
    inputs:
      ui_scope:
        description: Verification scope (quick = no simulator, smoke = key UI, full = release/IPA)
        type: choice
        default: quick
        options:
          - quick
          - smoke
          - full
          - ipv4
          - review
          - foundation
          - mask
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Core behavior tests
        run: swift test

      - name: Local IPv4 visual tests
        run: node --test scripts/test_ipv4_visual.cjs

      - name: Generate Xcode project
        run: |
          swift scripts/generate_icon.swift
          xcodegen generate

      # Daily/agent runs do not need an iphoneos build or IPA. The simulator
      # build below still catches normal compile errors. Full is the release gate.
      - name: Build device app and package IPA
        if: inputs.ui_scope == 'full'
        run: |
          set -o pipefail
          xcodebuild -project WangGan.xcodeproj -scheme WangGan -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1 || { tail -100 build-device.log; exit 1; }
          test -f build/device/Build/Products/Release-iphoneos/WangGan.app/lessons.json
          test -f build/device/Build/Products/Release-iphoneos/WangGan.app/ipv4-address-visual.html
          test -f build/device/Build/Products/Release-iphoneos/WangGan.app/Assets.car
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/WangGan.app build/package/Payload/
          cd build/package
          zip -qry ../WangGan-unsigned.ipa Payload

      - name: Select iPhone simulator
        if: inputs.ui_scope != 'quick'
        id: simulator
        run: |
          python3 scripts/select_simulator.py >> "$GITHUB_OUTPUT"

      - name: Run native UI tests
        if: inputs.ui_scope != 'quick'
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.id }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.id }}' -b
          python3 scripts/run_command_with_timeout.py --log build-simulator.log --idle-timeout 180 --wall-timeout 600 -- xcodebuild -project WangGan.xcodeproj -scheme WangGan -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build-for-testing
          python3 scripts/prepare_simulator_webkit.py --device '${{ steps.simulator.outputs.id }}' --products build/simulator/Build/Products/Debug-iphonesimulator
          mkdir -p build/screenshots
          xcrun simctl install '${{ steps.simulator.outputs.id }}' build/simulator/Build/Products/Debug-iphonesimulator/WangGan.app

          # The 15-second launch/log preflight is useful release evidence, but
          # it is pure overhead for the common quick path.
          if [ '${{ inputs.ui_scope }}' = 'full' ]; then
            SIMCTL_CHILD_DYLD_LIBRARY_PATH="$PWD/build/simulator/Build/Products/Debug-iphonesimulator" xcrun simctl launch '${{ steps.simulator.outputs.id }}' com.perinchiang.wanggan --uitesting --reset-progress --seed-before-subnet | tee launch-simulator.log
            sleep 15
            xcrun simctl io '${{ steps.simulator.outputs.id }}' screenshot build/screenshots/before-ui-tests.png
            xcrun simctl spawn '${{ steps.simulator.outputs.id }}' launchctl list | grep -i wanggan >> launch-simulator.log || true
            xcrun simctl spawn '${{ steps.simulator.outputs.id }}' log show --last 2m --style compact --predicate 'process == "WangGan"' >> launch-simulator.log || true
            xcrun simctl terminate '${{ steps.simulator.outputs.id }}' com.perinchiang.wanggan || true
          fi

          scope_args=()
          if [ '${{ inputs.ui_scope }}' = 'smoke' ]; then
            # High-signal simulator smoke set for current product surfaces.
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testHomeTwoBoxesFlow')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationAddressRoleFlow')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testShortReviewResumesWithoutReplacingMainOrDuplicatingXP')
          elif [ '${{ inputs.ui_scope }}' = 'ipv4' ]; then
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testSubnetResumesAndCompletesOnStepPlayer')
          elif [ -z '${{ inputs.ui_scope }}' ] || [ '${{ inputs.ui_scope }}' = 'foundation' ]; then
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationAddressRoleFlow')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationFormatBacktrackingResumeAndCompletion')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationOctetBinaryFlow')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testHopResumesAndCompletesOnStepPlayer')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testFoundationBinaryLargestTextStaticPresentation')
          elif [ '${{ inputs.ui_scope }}' = 'mask' ]; then
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationAddressRoleFlow')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationFormatBacktrackingResumeAndCompletion')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testIPv4FoundationOctetBinaryFlow')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testSubnetResumesAndCompletesOnStepPlayer')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testShortReviewResumesWithoutReplacingMainOrDuplicatingXP')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testFullLessonPersistenceAndResume')
          elif [ '${{ inputs.ui_scope }}' = 'review' ]; then
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testShortReviewResumesWithoutReplacingMainOrDuplicatingXP')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testDNSShortReviewHintAndNextScenario')
            scope_args+=('-only-testing:WangGanUITests/LearningUITests/testFullLessonPersistenceAndResume')
          fi

          python3 scripts/run_command_with_timeout.py --log build-ui.log --idle-timeout 180 --wall-timeout 1200 -- xcodebuild -project WangGan.xcodeproj -scheme WangGan -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult "${scope_args[@]}" CODE_SIGNING_ALLOWED=NO test-without-building

      - name: Export simulator screenshots
        if: always() && inputs.ui_scope != 'quick'
        run: |
          mkdir -p build/screenshots
          xcrun simctl io '${{ steps.simulator.outputs.id }}' screenshot build/screenshots/final-simulator.png || true
          xcrun simctl spawn '${{ steps.simulator.outputs.id }}' log show --last 10m --style compact --predicate 'process == "WangGan"' > build/screenshots/app-runtime.log || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'WangGan*' -exec cp {} build/screenshots/ \; || true
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots || true
          fi

      - name: Upload iPhone installation package
        uses: actions/upload-artifact@v4
        if: success() && inputs.ui_scope == 'full'
        with:
          name: WangGan-iPhone-unsigned
          path: build/WangGan-unsigned.ipa
          retention-days: 14

      - name: Upload evidence and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            build/screenshots
            build-device.log
            build-ui.log
            build-simulator.log
            launch-simulator.log
          if-no-files-found: ignore
          retention-days: 7
