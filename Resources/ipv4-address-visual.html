<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>IPv4 地址拆解</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2px; background: #f8f8f3; color: #171916; font-size: calc(16px * var(--font-scale, 1)); }
    .card { border: 1px solid #d9dbd2; border-radius: 18px; padding: 16px; background: #fff; }
    .address { font-size: 1.12em; font-weight: 750; letter-spacing: .01em; margin-bottom: 6px; overflow-wrap: anywhere; }
    .subline { color: #555b52; font-size: .87em; margin-bottom: 16px; line-height: 1.45; }
    .octets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(140px * var(--font-scale, 1))), 1fr)); gap: 9px; }
    .octet { border: 1.5px solid #d9dbd2; border-radius: 13px; background: #f6f7f2; padding: 11px 7px; min-width: 0; text-align: center; color: inherit; font: inherit; }
    button.octet { min-height: 76px; cursor: pointer; }
    .octet.selected { border-color: #171916; box-shadow: inset 0 0 0 1px #171916; }
    .octet .decimal { display: block; font-weight: 700; margin-bottom: 7px; }
    .bits { display: flex; justify-content: center; gap: 1px; font-family: ui-monospace, Menlo, monospace; font-size: .83em; }
    .bit { min-width: .9em; border-radius: 3px; padding: 2px 0; }
    .bit.network { background: #d5fa52; color: #171916; font-weight: 750; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; color: #4b5247; font-size: .81em; }
    .key { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid #c5c9bd; }
    .key.network { background: #d5fa52; border-color: #b3d43d; }
    .key.host { background: #f6f7f2; }
    .result { margin-top: 14px; line-height: 1.5; font-size: .9em; }
    .controls { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    .controls button { border: 1px solid #171916; border-radius: 11px; background: #fff; color: #171916; font: inherit; font-size: .86em; min-height: 44px; padding: 8px 12px; }
    .controls button:first-child { background: #171916; color: #fff; }
    :focus-visible { outline: 3px solid #718f1f; outline-offset: 3px; }
    @media (max-width: 330px) { .octets { grid-template-columns: 1fr; } }
    body.dark { background: #191b18; color: #f8f8f3; }
    body.dark .card { background: #242822; border-color: #5c6458; }
    body.dark .octet { background: #30372e; border-color: #687165; color: #f8f8f3; }
    body.dark .octet.selected { border-color: #d5fa52; }
    body.dark .subline, body.dark .legend { color: #d5ddd0; }
    body.dark .controls button { background: #30372e; color: #f8f8f3; border-color: #d5ddd0; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    (() => {
      'use strict';
      const app = document.getElementById('app');
      let state = null;
      let revealCount = 32;
      let timer = null;

      function post(type, value) {
        const bridge = window.webkit?.messageHandlers?.ipv4Visual;
        if (bridge) bridge.postMessage(value === undefined ? { type } : { type, value });
      }

      function parseIPv4(ip, prefix) {
        if (typeof ip !== 'string' || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(ip) ||
            !Number.isInteger(prefix) || prefix < 0 || prefix > 32) return null;
        const octets = ip.split('.').map(Number);
        if (octets.some(value => value > 255)) return null;
        return octets;
      }

      function networkAddress(ip, prefix) {
        const octets = parseIPv4(ip, prefix);
        if (!octets) return null;
        return octets.map((octet, index) => {
          const networkBits = Math.min(8, Math.max(0, prefix - index * 8));
          const mask = networkBits === 0 ? 0 : (255 << (8 - networkBits)) & 255;
          return octet & mask;
        }).join('.');
      }

      function stop() {
        if (timer !== null) clearInterval(timer);
        timer = null;
      }

      function render() {
        if (!state) return;
        const octets = parseIPv4(state.ip, state.prefix);
        if (!octets) { app.textContent = '地址暂时无法显示。'; post('error'); return; }
        const practice = state.mode === 'practice';
        const showNetwork = !practice || state.solved;
        const bitsShown = showNetwork ? Math.min(revealCount, state.prefix) : 0;
        document.body.classList.toggle('dark', state.theme === 'dark');
        document.documentElement.style.setProperty('--font-scale', String(state.fontScale));
        const cards = octets.map((octet, index) => {
          const binary = octet.toString(2).padStart(8, '0');
          const bits = [...binary].map((digit, bitIndex) => {
            const network = index * 8 + bitIndex < bitsShown;
            return `<span class="bit${network ? ' network' : ''}">${digit}</span>`;
          }).join('');
          const selected = practice && state.selectedOctet === index + 1;
          const label = `第 ${index + 1} 个字节，${octet}，二进制 ${binary}${selected ? '，已选为边界' : ''}`;
          const content = `<span class="decimal">${octet}</span><span class="bits" aria-hidden="true">${bits}</span>`;
          return practice && !state.solved
            ? `<button type="button" class="octet${selected ? ' selected' : ''}" data-boundary="${index + 1}" aria-label="${label}，点选为网络部分的最后一个字节" aria-pressed="${selected}">${content}</button>`
            : `<div class="octet" role="img" aria-label="${label}">${content}</div>`;
        }).join('');
        app.innerHTML = `<section class="card">
          <div class="address">${state.ip}/${state.prefix}</div>
          <div class="subline">${practice ? '点选网络部分结束的字节，再用下面的按钮检查。' : '亮色的位属于网络部分，其余属于主机部分。'}</div>
          <div class="octets">${cards}</div>
          <div class="legend"><span><i class="key network"></i>网络位</span><span><i class="key host"></i>主机位</span></div>
          ${showNetwork ? `<div class="result">网络地址：<strong>${networkAddress(state.ip, state.prefix)}/${state.prefix}</strong></div>` : ''}
          ${!practice ? `<div class="controls"><button type="button" data-command="replay">重播网络位</button><button type="button" data-command="pause">暂停</button><button type="button" data-command="step">单步</button></div>` : ''}
        </section>`;
        post('height', Math.ceil(document.body.scrollHeight));
      }

      function play() {
        if (!state || state.mode !== 'explain') return;
        stop();
        if (state.reduceMotion) { revealCount = state.prefix; render(); return; }
        timer = setInterval(() => {
          revealCount = Math.min(state.prefix, revealCount + 1);
          render();
          if (revealCount >= state.prefix) stop();
        }, 110);
      }

      function replay() { if (!state || state.mode !== 'explain') return; revealCount = 0; render(); play(); }
      function step() { stop(); if (state && state.mode === 'explain') { revealCount = Math.min(state.prefix, revealCount + 1); render(); } }

      function update(input) {
        if (!input || !parseIPv4(input.ip, input.prefix) || !['explain', 'practice'].includes(input.mode) ||
            !['light', 'dark'].includes(input.theme) || typeof input.fontScale !== 'number' ||
            input.fontScale < 0.8 || input.fontScale > 2.5 || typeof input.reduceMotion !== 'boolean' ||
            typeof input.solved !== 'boolean' ||
            !(input.selectedOctet === null || Number.isInteger(input.selectedOctet) && input.selectedOctet >= 1 && input.selectedOctet <= 4)) {
          post('error'); return;
        }
        const changedExample = !state || state.ip !== input.ip || state.prefix !== input.prefix || state.mode !== input.mode;
        state = input;
        if (changedExample) { stop(); revealCount = input.prefix; }
        render();
      }

      app.addEventListener('click', event => {
        const boundary = event.target.closest('[data-boundary]');
        if (boundary && state?.mode === 'practice' && !state.solved) {
          post('select', Number(boundary.dataset.boundary));
          return;
        }
        const command = event.target.closest('[data-command]')?.dataset.command;
        if (command === 'replay') replay();
        if (command === 'pause') stop();
        if (command === 'step') step();
      });

      window.WangGanIPv4 = { update, play, pause: stop, replay, step, parseIPv4, networkAddress };
      post('ready');
    })();
  </script>
</body>
</html>
